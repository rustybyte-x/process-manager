name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            ext: .exe

          - os: windows-latest
            target: i686-pc-windows-msvc
            name: windows-x86
            ext: .exe

          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
            ext: ""

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p process-manager

      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/pm${{ matrix.ext }} dist/

          cd dist
          zip pm-${{ matrix.name }}.zip pm${{ matrix.ext }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
