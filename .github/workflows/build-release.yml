name: build-release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: pm.exe
            asset_name: pm-windows-x64

          - name: windows-x86
            os: windows-latest
            target: i686-pc-windows-msvc
            binary_name: pm.exe
            asset_name: pm-windows-x86

          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: pm
            asset_name: pm-macos-arm64

          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary_name: pm
            asset_name: pm-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path crates/tui/Cargo.toml

      - name: Prepare package directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/${{ matrix.asset_name }} | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}/
          if (Test-Path README.md) { Copy-Item README.md dist/${{ matrix.asset_name }}/ }
          if (Test-Path LICENSE-MIT) { Copy-Item LICENSE-MIT dist/${{ matrix.asset_name }}/ }
          if (Test-Path LICENSE-APACHE) { Copy-Item LICENSE-APACHE dist/${{ matrix.asset_name }}/ }

      - name: Prepare package directory (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/${{ matrix.asset_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}/
          [ -f README.md ] && cp README.md dist/${{ matrix.asset_name }}/
          [ -f LICENSE-MIT ] && cp LICENSE-MIT dist/${{ matrix.asset_name }}/
          [ -f LICENSE-APACHE ] && cp LICENSE-APACHE dist/${{ matrix.asset_name }}/

      - name: Create ZIP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/${{ matrix.asset_name }}/* -DestinationPath dist/${{ matrix.asset_name }}.zip -Force

      - name: Create ZIP (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ${{ matrix.asset_name }}.zip ${{ matrix.asset_name }}

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.zip
